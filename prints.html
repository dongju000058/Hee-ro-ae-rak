<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>포스터 · 엽서 — 감정을 마주하다</title>
  <style>
    @font-face{font-family:Paperlogy;src:url('assets/fonts/Paperlogy-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:Paperlogy;src:url('assets/fonts/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#101010;font-family:Paperlogy,sans-serif}a{color:inherit;text-underline-offset:5px}header{display:flex;justify-content:space-between;align-items:center;padding:24px 4vw;border-bottom:1px solid #ddd}header a{text-decoration:none;padding:12px 0;font-size:13px}main{max-width:1440px;margin:auto;padding:52px 5vw 80px}h1{font-size:clamp(32px,5vw,64px);font-weight:500;letter-spacing:-.06em;line-height:1.15;margin:0 0 16px}.intro{font-size:14px;line-height:1.7;color:#555;margin-bottom:48px}.works{display:grid;grid-template-columns:1.2fr 1fr;align-items:start;gap:7vw}figure{margin:0}figcaption{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid #111;padding:16px 0 24px;font-size:15px}figcaption span{font-size:12px;color:#666}.art{display:block;width:100%;border:0;background:none;padding:0;cursor:zoom-in}.art img{display:block;width:100%;height:auto}.postcard .art{width:70%;margin:0 auto;aspect-ratio:105/148}.postcard img{width:100%;height:100%;object-fit:contain}.actions{display:flex;gap:24px;margin-top:24px;font-size:13px}.actions a{padding:10px 0}dialog{border:0;padding:60px 24px 24px;background:#fafafa;width:96vw;max-width:1500px;height:94dvh;max-height:94dvh}dialog::backdrop{background:rgba(0,0,0,.75)}dialog img{display:block;max-width:100%;height:100%;object-fit:contain;margin:auto}dialog button{position:absolute;right:20px;top:12px;border:0;background:none;font:inherit;padding:12px;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid #111;outline-offset:5px}@media(max-width:650px){main{padding-top:32px}.works{grid-template-columns:1fr;gap:48px}.intro{margin-bottom:28px}.postcard .art{width:80%}dialog{padding:56px 12px 16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <header><a href="Home.html">← 감정 선택으로</a><a href="Info.html">작품 소개 ↗</a></header>
  <main>
    <h1>포스터 · 엽서</h1>
    <p class="intro">감정을 마주하다 — 희로애락<br>이미지를 누르면 크게 볼 수 있습니다.</p>
    <div class="works">
      <figure><figcaption>포스터 <span>A1 · 594 × 841 mm</span></figcaption><button class="art" data-image="assets/print-poster.png" aria-label="포스터 크게 보기"><img src="assets/print-poster.png" width="2021" height="2861" alt="희로애락 글자와 네 감정 캐릭터가 사선으로 배치된 포스터" decoding="async"></button><div class="actions"><a href="assets/print-poster.png" download="희로애락_포스터.png">이미지 저장 ↓</a></div></figure>
      <figure class="postcard"><figcaption>엽서 <span>A6 비율 · 105 × 148 mm</span></figcaption><button class="art" data-image="assets/print-postcard.png" aria-label="엽서 크게 보기"><img src="assets/print-postcard.png" width="2021" height="2861" alt="감정을 마주하다 타이포그래피와 네 감정 캐릭터를 배치한 엽서" loading="lazy" decoding="async"></button><div class="actions"><a href="assets/print-postcard.png" download="희로애락_엽서.png">이미지 저장 ↓</a></div></figure>
    </div>
  </main>
  <dialog aria-label="작품 크게 보기"><button type="button" autofocus>닫기 ×</button><img alt=""></dialog>
  <script>
    const viewer=document.querySelector('dialog'),large=viewer.querySelector('img');
    document.querySelectorAll('.art').forEach(button=>button.addEventListener('click',()=>{large.src=button.dataset.image;large.alt=button.querySelector('img').alt;viewer.showModal()}));
    viewer.querySelector('button').addEventListener('click',()=>viewer.close());
    viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});
  </script>
</body>
</html>
